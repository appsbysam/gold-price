name: Change version label
on:
  push:
    paths:
      - '.github/workflows/change-version-label.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change Version 1.1 to v1.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'Version 1.1' not in s:
              raise SystemExit('Version 1.1 label not found')
          p.write_text(s.replace('Version 1.1','v1.1',1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Change version label to v1.1'
          git push
