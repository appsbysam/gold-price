name: Update gold history

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'history.json'

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build 7-day gold history
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timedelta, timezone

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'appsbysam-gold-price/1.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  return json.loads(r.read().decode('utf-8'))

          today = datetime.now(timezone.utc).date()
          start = today - timedelta(days=14)

          # XAUS provides keyless daily XAU/USD history (up to five years).
          hist = get_json('https://xaus.com/api/v1/history')
          gold = {}
          for point in hist.get('points', []):
              d = point.get('d')
              c = point.get('c')
              try:
                  if d and c is not None:
                      gold[d] = float(c)
              except (TypeError, ValueError):
                  pass

          # Use the app's existing live source for today's intraday quote when available.
          try:
              live = get_json('https://api.gold-api.com/price/XAU')
              gold[today.isoformat()] = float(live['price'])
          except Exception:
              pass

          fx_rows = get_json(
              'https://api.frankfurter.dev/v2/rates?base=USD&quotes=AUD'
              f'&from={start.isoformat()}&to={today.isoformat()}'
          )
          fx = {}
          for row in fx_rows:
              try:
                  if row.get('quote') == 'AUD':
                      fx[row['date']] = float(row['rate'])
              except (KeyError, TypeError, ValueError):
                  pass
          try:
              live_fx = get_json('https://api.frankfurter.dev/v2/rate/USD/AUD')
              fx[today.isoformat()] = float(live_fx['rate'])
          except Exception:
              pass

          def latest(values, day):
              choices=[]
              for ds,val in values.items():
                  try: d=datetime.strptime(ds,'%Y-%m-%d').date()
                  except ValueError: continue
                  if d <= day: choices.append((d,val))
              return max(choices, key=lambda x:x[0])[1] if choices else None

          prices=[]
          for offset in range(7):
              day=today-timedelta(days=offset)
              usd=latest(gold,day)
              rate=latest(fx,day)
              if usd is None or rate is None: continue
              prices.append({'date':day.isoformat(),'usd_oz':round(usd,2),'aud_oz':round(usd*rate,2),'usd_aud':round(rate,6)})

          if not prices:
              raise RuntimeError('No historical prices could be assembled')

          with open('history.json','w',encoding='utf-8') as f:
              json.dump({'generated_at':datetime.now(timezone.utc).isoformat(),'prices':prices,'note':'Seven calendar days; non-trading days carry forward the latest available market close.'},f,indent=2)
              f.write('\n')
          PY

      - name: Commit history if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "No history change to commit"
          else
            git commit -m "Update 7-day gold history"
            git push
          fi
