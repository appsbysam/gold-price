name: Release v1.2
on:
  push:
    paths:
      - '.github/workflows/release-v1.2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add modal timestamp and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('>v1.1</div>', '>v1.2</div>', 1)
          s = s.replace("el('historyStatus').textContent=`Today synced to live price · ${formatUpdateTime(liveUpdatedAt)}`;", "el('historyStatus').textContent=`Live prices updated ${formatUpdateTime(liveUpdatedAt)}`;", 1)
          s = s.replace("el('historyStatus').textContent=`7-day history loaded${liveUpdatedAt?' · today synced to live price':''}`", "el('historyStatus').textContent=liveUpdatedAt?`Live prices updated ${formatUpdateTime(liveUpdatedAt)}`:'7-day history loaded'", 1)
          if '>v1.2</div>' not in s:
              raise SystemExit('Version bump failed')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release v1.2 with history timestamp'
          git push
