name: Fix 7-day history display
on:
  push:
    paths:
      - '.github/workflows/fix-history-display.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix history field mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const d=row.date||row.day||'',u=Number(row.usd??row.usdOz??row.price),a=Number(row.aud??row.audOz??(u*usdAud));tr.innerHTML=`<td>${d}${i===0?' · Today':''}</td><td>${money(u,'USD')}</td><td>${money(a,'AUD')}</td>`;"
          new = "const d=row.date||row.day||'';const isToday=i===0;const storedUsd=Number(row.usd_oz??row.usd??row.usdOz??row.price);const storedAud=Number(row.aud_oz??row.aud??row.audOz);const u=isToday&&Number.isFinite(goldUsdOz)?goldUsdOz:storedUsd;const a=isToday&&Number.isFinite(goldUsdOz)&&Number.isFinite(usdAud)?goldUsdOz*usdAud:(Number.isFinite(storedAud)?storedAud:u*usdAud);const dateObj=new Date(d+'T12:00:00');const dateLabel=Number.isNaN(dateObj.getTime())?d:dateObj.toLocaleDateString('en-AU',{weekday:'short',day:'2-digit',month:'short'});tr.innerHTML=`<td>${dateLabel}${isToday?' · Today':''}</td><td>${money(u,'USD')}</td><td>${money(a,'AUD')}</td>`;"
          if old not in s:
              raise SystemExit('Expected history parser block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix 7-day history price display'
          git push
