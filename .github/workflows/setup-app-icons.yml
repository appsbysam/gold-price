name: Finalise Gold Spot app icons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/setup-app-icons.yml'
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore app and wire icons
        env:
          INDEX_GZ_B64: 
        run: |
          echo "$INDEX_GZ_B64" | base64 -d | gzip -d > index.html
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Image.open('assets/icons/icon-192.png').convert('RGBA')
          for n in [16,32,48,64,72,96,128,144,152,180,192,256,512,1024]:
              src.resize((n,n),Image.Resampling.LANCZOS).save(f'assets/icons/icon-{n}x{n}.png')
          src.resize((512,512),Image.Resampling.LANCZOS).save('assets/icons/icon-512.png')
          src.resize((180,180),Image.Resampling.LANCZOS).save('assets/icons/apple-touch-icon.png')
          src.resize((32,32),Image.Resampling.LANCZOS).save('assets/icons/favicon-32x32.png')
          src.resize((16,16),Image.Resampling.LANCZOS).save('assets/icons/favicon-16x16.png')
          PY
      - name: Commit final icon setup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest assets/icons
          git diff --cached --quiet || git commit -m 'Finalise PWA icons and manifest'
          git push
