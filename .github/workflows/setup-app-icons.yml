name: Setup app icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/icons/**'
      - '.github/workflows/setup-app-icons.yml'
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure favicon and install icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          tags='''  <meta name="theme-color" content="#171a21" />\n  <link rel="manifest" href="manifest.webmanifest" />\n  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png" />\n  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png" />\n  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />\n'''
          if 'rel="manifest"' not in s:
              s=s.replace('  <title>Gold Spot Converter</title>\n','  <title>Gold Spot Converter</title>\n'+tags,1)
              p.write_text(s)
          manifest={
            'name':'Gold Spot Converter','short_name':'Gold Spot','start_url':'./','scope':'./','display':'standalone',
            'background_color':'#0f1115','theme_color':'#171a21',
            'icons':[
              {'src':'assets/icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
              {'src':'assets/icons/icon-512.svg','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,indent=2)+'\n')
          svg='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="110" fill="#11151d"/><g transform="rotate(-8 256 256)"><path d="M120 285h272l-38 105H158z" fill="#d99b16" stroke="#ffcf45" stroke-width="10"/><path d="M158 230h196l38 55H120z" fill="#ffc52d" stroke="#ffe080" stroke-width="10"/></g><circle cx="165" cy="170" r="92" fill="#f4bd28" stroke="#ffe071" stroke-width="10"/><text x="165" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="112" font-weight="900" fill="#17120a">$</text></svg>'''
          Path('assets/icons/icon-512.svg').write_text(svg)
          PY
      - name: Commit generated web app icon wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest assets/icons/icon-512.svg
          git diff --cached --quiet || git commit -m 'Configure app icons and manifest'
          git push
