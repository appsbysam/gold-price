name: Setup app icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/icons/**'
      - '.github/workflows/setup-app-icons.yml'
permissions:
  contents: write
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate complete icon set and wire app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          for size in 16 32 48 64 72 96 128 144 152 180 192 256 512 1024; do
            convert assets/icons/icon-192.png -resize ${size}x${size} assets/icons/icon-${size}x${size}.png
          done
          cp assets/icons/icon-180x180.png assets/icons/apple-touch-icon.png
          cp assets/icons/icon-192x192.png assets/icons/icon-192.png
          cp assets/icons/icon-512x512.png assets/icons/icon-512.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          tags='''  <meta name="theme-color" content="#171a21" />\n  <link rel="manifest" href="manifest.webmanifest" />\n  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32x32.png" />\n  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16x16.png" />\n  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />\n'''
          if 'rel="manifest"' not in s:
              s=s.replace('  <title>Gold Spot Converter</title>\n','  <title>Gold Spot Converter</title>\n'+tags,1)
              p.write_text(s)
          manifest={
            'name':'Gold Spot Converter','short_name':'Gold Spot','description':'Live gold spot price and Lebanon 18K market estimate in USD and AUD.',
            'start_url':'./','scope':'./','display':'standalone','background_color':'#0f1115','theme_color':'#171a21',
            'icons':[
              {'src':'assets/icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any maskable'},
              {'src':'assets/icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Commit generated icons and app wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest assets/icons
          git diff --cached --quiet || git commit -m 'Configure complete app icon set and manifest'
          git push
